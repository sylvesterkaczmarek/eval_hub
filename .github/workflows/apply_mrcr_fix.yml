name: Apply MRCR sample-limit fix

on:
  push:
    branches:
      - fix/mrcr-v2-sample-limit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mrcr-v2-sample-limit

      - name: Apply source fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("eval_hub/mrcr_v2/mrcr_utils.py")
          text = path.read_text(encoding="utf-8")

          old_outer = '''  # Produce the final query for each seed (and its position).
  for _, group_query_dict in position_updated_rqgs.items():
    final_question = group_query_dict["follow_up_base_prompt_format"]
'''
          new_outer = '''  # Produce the final query for each seed (and its position).
  for _, group_query_dict in position_updated_rqgs.items():
    if num_samples_added >= sample_limit:
      break
    final_question = group_query_dict["follow_up_base_prompt_format"]
'''
          if old_outer not in text:
            raise SystemExit("Could not locate generate_queries_and_answers loop")
          text = text.replace(old_outer, new_outer, 1)

          old_bucket = '''      curr_all_query_answers = generate_queries_and_answers(
          position_updated_rqgs,
          full_transcript,
          token_count,
          num_seeds,
          samples_per_bucket,
          json_style,
          tokenizer,
      )
'''
          new_bucket = '''      remaining_samples = samples_per_bucket - len(all_query_answers)
      curr_all_query_answers = generate_queries_and_answers(
          position_updated_rqgs,
          full_transcript,
          token_count,
          num_seeds,
          remaining_samples,
          json_style,
          tokenizer,
      )
'''
          if old_bucket not in text:
            raise SystemExit("Could not locate generate_mrcr_v2 sample-limit call")
          text = text.replace(old_bucket, new_bucket, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run regression tests
        shell: bash
        run: |
          python -m pip install --quiet pandas
          python -m unittest eval_hub.mrcr_v2.mrcr_utils_test

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/apply_mrcr_fix.yml
          git add eval_hub/mrcr_v2/mrcr_utils.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: enforce MRCR v2 sample limits"
          git push origin HEAD:fix/mrcr-v2-sample-limit
